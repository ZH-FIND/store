services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - coffeeflow_mysql:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d:ro

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/coffeeflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      DB_USER: coffeeflow
      DB_PASSWORD: coffeeflow
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4173}:80"

volumes:
  coffeeflow_mysql:
